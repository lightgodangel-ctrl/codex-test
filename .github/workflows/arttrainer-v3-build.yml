name: Build ArtTrainer v3 APK

on:
  push:
    paths:
      - 'arttrainer_build/src.part*'
      - '.github/workflows/arttrainer-v3-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          cat arttrainer_build/src.part00 arttrainer_build/src.part01 arttrainer_build/src.part02 arttrainer_build/src.part03 arttrainer_build/src.part04 > /tmp/arttrainer.b64
          base64 -d /tmp/arttrainer.b64 > /tmp/arttrainer.zip
          unzip -t /tmp/arttrainer.zip
          rm -rf /tmp/arttrainer
          mkdir -p /tmp/arttrainer
          unzip -q /tmp/arttrainer.zip -d /tmp/arttrainer
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/arttrainer/ArtTrainer_AllInOne_v3/app/src/main/java/com/arttrainer/toolbox/OverlayService.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('toast("흑백 신호 전송");', 'Toast.makeText(this, "흑백 신호 전송", Toast.LENGTH_SHORT).show();')
          s=s.replace('toast("색상 반전 신호 전송");', 'Toast.makeText(this, "색상 반전 신호 전송", Toast.LENGTH_SHORT).show();')
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: /tmp/arttrainer/ArtTrainer_AllInOne_v3
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp /tmp/arttrainer/ArtTrainer_AllInOne_v3/app/build/outputs/apk/debug/app-debug.apk artifact/ArtTrainer_AllInOne_v3_MacroDroid.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArtTrainer_AllInOne_v3_MacroDroid
          path: artifact/ArtTrainer_AllInOne_v3_MacroDroid.apk
          if-no-files-found: error
