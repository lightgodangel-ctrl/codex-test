name: Build ArtTrainer v3 APK

on:
  push:
    paths:
      - 'arttrainer_build/src.part*'
      - '.github/workflows/arttrainer-v3-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore source
        run: |
          cat arttrainer_build/src.part00 arttrainer_build/src.part01 arttrainer_build/src.part02 arttrainer_build/src.part03 arttrainer_build/src.part04 > /tmp/arttrainer.b64
          base64 -d /tmp/arttrainer.b64 > /tmp/arttrainer.zip
          unzip -t /tmp/arttrainer.zip
          mkdir -p /tmp/arttrainer
          unzip -q /tmp/arttrainer.zip -d /tmp/arttrainer
      - name: Build APK
        working-directory: /tmp/arttrainer/ArtTrainer_AllInOne_v3
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp /tmp/arttrainer/ArtTrainer_AllInOne_v3/app/build/outputs/apk/debug/app-debug.apk artifact/ArtTrainer_AllInOne_v3_MacroDroid.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArtTrainer_AllInOne_v3_MacroDroid
          path: artifact/ArtTrainer_AllInOne_v3_MacroDroid.apk
          if-no-files-found: error
