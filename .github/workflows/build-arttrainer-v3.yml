name: Build ArtTrainer v3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-arttrainer-v3.yml'
      - 'arttrainer_build/src.part*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          cat arttrainer_build/src.part00 arttrainer_build/src.part01 arttrainer_build/src.part02 arttrainer_build/src.part03 arttrainer_build/src.part04 > /tmp/arttrainer.b64
          base64 -d /tmp/arttrainer.b64 > /tmp/arttrainer.zip
          unzip -q /tmp/arttrainer.zip -d /tmp/project
          unzip -t /tmp/arttrainer.zip
          sed -i "s/version '8.13.2'/version '8.7.3'/" /tmp/project/ArtTrainer_AllInOne_v3/build.gradle
          FILE=/tmp/project/ArtTrainer_AllInOne_v3/app/src/main/java/com/arttrainer/toolbox/OverlayService.java
          sed -i 's/toast("흑백 신호 전송");/Toast.makeText(this, "흑백 신호 전송", Toast.LENGTH_SHORT).show();/' "$FILE"
          sed -i 's/toast("색상 반전 신호 전송");/Toast.makeText(this, "색상 반전 신호 전송", Toast.LENGTH_SHORT).show();/' "$FILE"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: /tmp/project/ArtTrainer_AllInOne_v3
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          exit $code

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          APK=/tmp/project/ArtTrainer_AllInOne_v3/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/apk.sha256"
          cp "$APK" "$GITHUB_WORKSPACE/ArtTrainer_AllInOne_v3.apk"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArtTrainer-v3-build-output
          path: |
            build.log
            apk.sha256
            ArtTrainer_AllInOne_v3.apk
          if-no-files-found: warn
          retention-days: 7
