name: Build ArtTrainer APK

on:
  push:
    paths:
      - 'arttrainer_build/parts/**'
      - '.github/workflows/build-arttrainer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode and build
        run: |
          mkdir -p work
          cat arttrainer_build/parts/*.b64 > work/source.b64
          base64 -d work/source.b64 > work/source.zip
          unzip -q work/source.zip -d work
          cd work/ArtTrainer_AllInOne_v3
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../ArtTrainer_AllInOne_v3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArtTrainer-AllInOne-v3
          path: work/ArtTrainer_AllInOne_v3.apk
