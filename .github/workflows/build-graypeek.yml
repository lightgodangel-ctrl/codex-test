name: Build GrayPeek APK

on:
  push:
    branches: [graypeek-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore project
        run: |
          base64 -d graypeek_project.b64 > graypeek.zip
          unzip -q graypeek.zip

      - name: Build debug APK
        run: gradle -p GrayPeek :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp GrayPeek/app/build/outputs/apk/debug/app-debug.apk out/GrayPeek-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrayPeek-debug-apk
          path: out/GrayPeek-debug.apk
          if-no-files-found: error
