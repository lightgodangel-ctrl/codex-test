name: Build GrayPeek APK

on:
  push:
    branches: [graypeek-apk-build]
    paths:
      - 'graypeek_project.b64'
      - '.github/workflows/graypeek-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode project
        run: |
          python3 - <<'PY'
          import base64, pathlib
          data = pathlib.Path('graypeek_project.b64').read_text().strip()
          pathlib.Path('graypeek.zip').write_bytes(base64.b64decode(data))
          PY
          unzip -o graypeek.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p GrayPeek --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp GrayPeek/app/build/outputs/apk/debug/app-debug.apk out/GrayPeek-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrayPeek-APK
          path: out/GrayPeek-debug.apk
          if-no-files-found: error
