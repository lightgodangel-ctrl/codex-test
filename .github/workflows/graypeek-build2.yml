name: Build GrayPeek APK v2

on:
  push:
    branches: [graypeek-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode clean project
        run: |
          mkdir work
          base64 -d graypeek_project.b64 > work/graypeek.zip
          cd work
          unzip -q graypeek.zip
      - name: Build debug APK
        run: gradle -p work/GrayPeek :app:assembleDebug --stacktrace
      - name: Collect APK
        run: |
          mkdir out
          cp work/GrayPeek/app/build/outputs/apk/debug/app-debug.apk out/GrayPeek-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GrayPeek-debug-apk-v2
          path: out/GrayPeek-debug.apk
          if-no-files-found: error
