<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d5dfc" />
    <meta name="description" content="오늘 해야 할 일을 간단하게 기록하고 관리하세요." />
    <title>오늘의 할 일</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-labelledby="app-title">
        <header class="app-header">
          <div>
            <p class="eyebrow">MY DAILY LIST</p>
            <h1 id="app-title">오늘의 할 일</h1>
            <p class="date" id="today"></p>
          </div>
          <div class="progress" aria-live="polite">
            <strong id="remaining-count">0</strong>
            <span>남음</span>
          </div>
        </header>

        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">새 할 일</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            maxlength="100"
            placeholder="무엇을 해야 하나요?"
            autocomplete="off"
            required
          />
          <button type="submit" aria-label="할 일 추가">
            <span aria-hidden="true">＋</span>
            <span class="button-label">추가</span>
          </button>
        </form>

        <div class="toolbar">
          <div class="filters" role="group" aria-label="할 일 필터">
            <button class="filter active" type="button" data-filter="all" aria-pressed="true">전체</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">진행 중</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">완료</button>
          </div>
          <span id="total-count">0개의 할 일</span>
        </div>

        <ul class="todo-list" id="todo-list" aria-label="할 일 목록"></ul>

        <div class="empty-state" id="empty-state">
          <div class="empty-icon" aria-hidden="true">✓</div>
          <h2>목록이 비어 있어요</h2>
          <p>오늘 할 일을 하나 추가해 보세요.</p>
        </div>
      </section>
      <p class="footer-copy">작은 할 일부터, 가볍게 시작해요.</p>
    </main>
  </body>
</html>
